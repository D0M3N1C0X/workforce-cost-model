</style><rect width="720" height="464" rx="16" fill="var(--surface)"/><text x="24" y="34" class="title">Volume explains the FY2026 overrun</text><text x="24" y="54">FY2026 cost against budget, by effect</text><rect x="150" y="66" width="12" height="12" rx="2" fill="var(--up)"/><text x="168" y="76">Adds cost</text><rect x="260" y="66" width="12" height="12" rx="2" fill="var(--down)"/><text x="278" y="76">Saves cost</text><text x="24" y="104" class="val" style="font-weight:600">IT · Milan</text><text x="24" y="122" class="muted">Budget €57.7M → actual €60.8M</text><line x1="410.0" x2="410.0" y1="128" y2="240" stroke="var(--axis)"/><text x="182" y="154.0" text-anchor="end">Volume</text><rect x="410.0" y="140" width="220.0" height="20" rx="3" fill="var(--up)"><title>IT · Milan volume: €3.51M</title></rect><text x="636.0" y="154.0" text-anchor="start" class="val">+€3.51M</text><text x="182" y="190.0" text-anchor="end">Mix</text><rect x="410.0" y="176" width="3.9" height="20" rx="3" fill="var(--up)"><title>IT · Milan mix: €0.06M</title></rect><text x="419.9" y="190.0" text-anchor="start" class="val">+€0.06M</text><text x="182" y="226.0" text-anchor="end">Rate</text><rect x="377.8" y="212" width="32.2" height="20" rx="3" fill="var(--down)"><title>IT · Milan rate: €-0.51M</title></rect><text x="371.8" y="226.0" text-anchor="end" class="val">−€0.51M</text><text x="24" y="284" class="val" style="font-weight:600">PL · Kraków</text><text x="24" y="302" class="muted">Budget €43.6M → actual €46.3M</text><line x1="410.0" x2="410.0" y1="308" y2="420" stroke="var(--axis)"/><text x="182" y="334.0" text-anchor="end">Volume</text><rect x="410.0" y="320" width="174.8" height="20" rx="3" fill="var(--up)"><title>PL · Kraków volume: €2.79M</title></rect><text x="590.8" y="334.0" text-anchor="start" class="val">+€2.79M</text><text x="182" y="370.0" text-anchor="end">Mix</text><rect x="410.0" y="356" width="7.7" height="20" rx="3" fill="var(--up)"><title>PL · Kraków mix: €0.12M</title></rect><text x="423.7" y="370.0" text-anchor="start" class="val">+€0.12M</text><text x="182" y="406.0" text-anchor="end">Rate</text><rect x="399.3" y="392" width="10.7" height="20" rx="3" fill="var(--down)"><title>PL · Kraków rate: €-0.17M</title></rect><text x="393.3" y="406.0" text-anchor="end" class="val">−€0.17M</text></svg>
